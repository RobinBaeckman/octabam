site_name: octabam manual
site_description: A community remixer for the Elektron Octatrack. Choose a remix, explore its modules, and build from your own OS 1.40C.
site_url: https://sambanks.github.io/octabam/
repo_url: https://github.com/sambanks/octabam
repo_name: sambanks/octabam
docs_dir: .
site_dir: ../../out/site
# the _remix-*.md fragments are snippet includes, not pages
exclude_docs: |
  reference/_remix-*.md
  overrides/**
extra_css:
  - css/manual.css
theme:
  name: shadcn
  custom_dir: overrides
  hide_source_files: true
  # The theme follows the system appearance; its header toggle can override it.
  show_title: true
  show_stargazers: false
  pygments_style:
    light: shadcn-light
    dark: github-dark
nav:
  - Get started:
      - Overview: index.md
      - Choose a remix: choosing.md
      - Build and flash: build-flash.md
      - Safety and recovery: safety.md
  - Remixes:
      - octabam-core: remix-core.md
      - octabam-inserts: remix-inserts.md
      - octabam-bus: remix-bus.md
  - Customize:
      - Build your own remix: own-remix.md
      - BRAIN: brain.md
  - Reference:
      - Modules: reference/modules.md
      - Credits: reference/credits.md
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      # resolved from the repository root: mkdocs runs there, locally and in CI
      base_path: [docs/site]
