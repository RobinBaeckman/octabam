{% if page.previous_page or page.next_page %}
<nav class="manual-pagination" aria-label="Page navigation">
  {% if page.previous_page %}
  <a href="{{ page.previous_page.url | url }}" rel="prev">
    <span>← Previous</span>{{ page.previous_page.title }}
  </a>
  {% endif %}
  {% if page.next_page %}
  <a class="manual-next" href="{{ page.next_page.url | url }}" rel="next">
    <span>Next →</span>{{ page.next_page.title }}
  </a>
  {% endif %}
</nav>
{% endif %}
